name: tests

on:
  push:
    branches: [main, "fix/**"]
  pull_request:
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Check Python version
        run: python3.10 --version
      - name: Install test dependencies
        run: python3.10 -m pip install --upgrade pip pytest pandas numpy biopython scikit-learn pybedtools
      - name: Compile Python sources
        run: python3.10 -m compileall -q plantsetdelta tests
      - name: Run unit tests
        run: python3.10 -m pytest -q
