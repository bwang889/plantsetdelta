name: tests

on:
  push:
    branches: [main, "fix/**"]
  pull_request:
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Check Python version
        run: python3.10 --version
      - name: Install test dependencies
        run: python3.10 -m pip install --upgrade pip pytest pandas numpy biopython scikit-learn pybedtools
      - name: Compile Python sources
        run: python3.10 -m compileall -q plantsetdelta tests
      - name: Test k-mer implementations
        id: kmer
        continue-on-error: true
        run: python3.10 -m pytest -q tests/test_kmer.py
      - name: Test fold-safe feature selection
        id: selector
        continue-on-error: true
        run: python3.10 -m pytest -q tests/test_feature_selection.py
      - name: Test genomic sequence extraction
        id: sequence
        continue-on-error: true
        run: python3.10 -m pytest -q tests/test_extract_sequences.py
      - name: Test strict TF bin coordinates
        id: tfbins
        continue-on-error: true
        run: python3.10 -m pytest -q tests/test_tf_bins.py
      - name: Check test results
        if: always()
        run: |
          test "${{ steps.kmer.conclusion }}" = success
          test "${{ steps.selector.conclusion }}" = success
          test "${{ steps.sequence.conclusion }}" = success
          test "${{ steps.tfbins.conclusion }}" = success

  package-smoke:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Check Python version
        run: python3.10 --version
      - name: Upgrade pip
        run: python3.10 -m pip install --upgrade pip
      - name: Build and install PlantSetDelta package
        id: package
        continue-on-error: true
        run: python3.10 -m pip install -e . --no-deps
      - name: Install runtime dependencies
        id: dependencies
        continue-on-error: true
        run: python3.10 -m pip install -r requirements.txt pytest
      - name: Run end-to-end CLI smoke test
        id: smoke
        continue-on-error: true
        run: python3.10 -m pytest -q tests/test_cli_smoke.py
      - name: Check package integration results
        if: always()
        run: |
          test "${{ steps.package.conclusion }}" = success
          test "${{ steps.dependencies.conclusion }}" = success
          test "${{ steps.smoke.conclusion }}" = success
